# CI/CD theo DEPLOY-PLAYBOOK: CI build image → GHCR; platform trên VPS (Coolify/
# Dokploy) pull + chạy, kích hoạt qua API hook (KHÔNG SSH tay). Bật job deploy bằng
# biến DEPLOY_ON=true + 3 secret DEPLOY_HOOK_URL/DEPLOY_TOKEN/DEPLOY_APP_ID.
name: build-and-deploy

on:
  push:
    branches: [feat/kg-ingest-v2.2, main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Tự suy từ repo chạy CI → ghcr.io/hungnguyen-phi/tutor (khỏi hardcode nhầm).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64      # 1 kiến trúc (VPS amd64) — tránh build đa-arch chậm
          provenance: false           # manifest ĐƠN → pull gọn
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha        # cache layer giữa các lần build
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Chưa đặt DEPLOY_ON=true → chỉ build+push, BỎ QUA deploy (không đỏ workflow).
    if: ${{ vars.DEPLOY_ON == 'true' }}
    steps:
      # THỬ LẠI 4 LƯỢT. Ảnh đã nằm trên GHCR rồi; hỏng ở đây chỉ là "chưa gọi
      # được VPS". Coolify đứng sau Cloudflare nên hay gặp 5xx thoáng qua khi
      # panel đang bận/khởi động lại (27/07: 525 = bắt tay TLS Cloudflare↔origin
      # hỏng, build xanh mà web vẫn là bản cũ, không ai biết cho tới lúc mở web).
      # In HTTP code ra để lần sau nhìn log là biết ngay lỗi mạng hay lỗi token.
      - name: Kích hoạt platform deploy (Coolify)
        run: |
          url="${{ secrets.DEPLOY_HOOK_URL }}/api/v1/deploy?uuid=${{ secrets.DEPLOY_APP_ID }}&force=true"
          for i in 1 2 3 4; do
            code=$(curl -sS -o /tmp/deploy.out -w '%{http_code}' --max-time 60 \
              -X POST "$url" -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" || echo 000)
            echo "lượt $i → HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              cat /tmp/deploy.out; echo; exit 0
            fi
            # 401/403/404 là sai secret/uuid — thử lại vô ích, dừng ngay.
            case "$code" in 401|403|404) cat /tmp/deploy.out; echo; exit 1;; esac
            sleep 20
          done
          echo "::error::Không gọi được deploy hook sau 4 lượt (HTTP $code). Ảnh ĐÃ có trên GHCR — vào Coolify bấm Redeploy, hoặc chạy lại job này."
          cat /tmp/deploy.out || true
          exit 1
