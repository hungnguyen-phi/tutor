# CI/CD theo DEPLOY-PLAYBOOK: CI build image → GHCR; platform trên VPS (Coolify/
# Dokploy) pull + chạy, kích hoạt qua API hook (KHÔNG SSH tay). Bật job deploy bằng
# biến DEPLOY_ON=true + 3 secret DEPLOY_HOOK_URL/DEPLOY_TOKEN/DEPLOY_APP_ID.
name: build-and-deploy

on:
  push:
    branches: [feat/kg-ingest-v2.2, main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Tự suy từ repo chạy CI → ghcr.io/hungnguyen-phi/tutor (khỏi hardcode nhầm).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64      # 1 kiến trúc (VPS amd64) — tránh build đa-arch chậm
          provenance: false           # manifest ĐƠN → pull gọn
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha        # cache layer giữa các lần build
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Chưa đặt DEPLOY_ON=true → chỉ build+push, BỎ QUA deploy (không đỏ workflow).
    if: ${{ vars.DEPLOY_ON == 'true' }}
    steps:
      - name: Kích hoạt platform deploy (Coolify)
        run: |
          curl -fsS -X POST \
            "${{ secrets.DEPLOY_HOOK_URL }}/api/v1/deploy?uuid=${{ secrets.DEPLOY_APP_ID }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}"
