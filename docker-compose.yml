# DỰ PHÒNG / chạy tay (VPS chưa cài platform). Theo DEPLOY-PLAYBOOK, cách CHÍNH là
# Coolify/Dokploy pull image + chạy + domain + TLS, kích hoạt qua API hook trong
# .github/workflows/deploy.yml — khi đó KHÔNG cần file compose này.
# Dùng file này nếu muốn tự `docker compose pull && up -d` trên VPS trần:
# CI đẩy image lên GHCR; cổng mặc định 8080 (đổi bằng WEB_PORT). Reverse proxy
# (Caddy/Traefik) phía trước nếu cần domain + HTTPS — xem ghi chú cuối file.
services:
  web:
    image: ghcr.io/hungnguyen-phi/tutor:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"

# ── HTTPS (tuỳ chọn) ──────────────────────────────────────────────────────────
# Muốn tên miền + chứng chỉ tự động, thêm Caddy làm reverse proxy:
#
#   caddy:
#     image: caddy:alpine
#     restart: unless-stopped
#     ports: ["80:80", "443:443"]
#     volumes:
#       - ./Caddyfile:/etc/caddy/Caddyfile
#       - caddy_data:/data
#     depends_on: [web]
#
# Caddyfile (1 dòng):  tutor.truongvietanh.com { reverse_proxy web:80 }
# volumes: { caddy_data: {} }
