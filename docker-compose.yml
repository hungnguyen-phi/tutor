# Chạy image tĩnh trên VPS. CI đẩy image lên GHCR; VPS chỉ `pull` + `up -d`.
# Cổng mặc định 8080 (đổi bằng biến WEB_PORT). Đặt reverse proxy (Caddy/Traefik/
# nginx host) phía trước nếu cần domain + HTTPS — xem ghi chú cuối file.
services:
  web:
    image: ghcr.io/duong-edu/tutor:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"

# ── HTTPS (tuỳ chọn) ──────────────────────────────────────────────────────────
# Muốn tên miền + chứng chỉ tự động, thêm Caddy làm reverse proxy:
#
#   caddy:
#     image: caddy:alpine
#     restart: unless-stopped
#     ports: ["80:80", "443:443"]
#     volumes:
#       - ./Caddyfile:/etc/caddy/Caddyfile
#       - caddy_data:/data
#     depends_on: [web]
#
# Caddyfile (1 dòng):  tutor.truongvietanh.com { reverse_proxy web:80 }
# volumes: { caddy_data: {} }
