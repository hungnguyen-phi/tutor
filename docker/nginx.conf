# Phục vụ Next static export (trailingSlash:true → mỗi trang là thư mục/index.html).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tài nguyên có hash (bất biến) → cache dài.
  # KHÔNG dùng `expires` kèm `add_header`: đo bằng chính nginx:alpine (30/07) thì
  # cặp đó trả ra HAI dòng Cache-Control ("max-age=31536000" và "public, immutable").
  # Trình duyệt gộp được, Cloudflare cũng gộp được — nhưng đó là may, không phải
  # thiết kế. Một dòng duy nhất, tự mình viết đủ, thì proxy nào đọc cũng ra một nghĩa.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Tài sản thương hiệu (/brand: 35 sprite sư tử, huy hiệu, favicon) — KHÔNG có
  # hash trong tên, nên không dám "immutable", nhưng 4 giờ (mặc định cũ, đo được
  # trên production 30/07: `Cache-Control: max-age=14400`) là quá ngắn cho ảnh cả
  # năm không đổi: học sinh vào lại mỗi buổi chiều là tải lại nguyên bộ.
  # 30 ngày + stale-while-revalidate: đổi ảnh thì lần vào sau vẫn hiện bản cũ
  # NGAY (không chờ mạng) rồi lặng lẽ lấy bản mới về cho lần sau. Muốn đổi gấp
  # thì đổi tên file — đó cũng chính là cách bộ sprite vừa đi từ .png sang .webp.
  location /brand/ {
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  # Trang: thử file, thư mục/index.html, rồi .html. Không có → trang 404 của Next.
  location / {
    # HTML trước đây KHÔNG mang Cache-Control nào (đo 30/07: chỉ có
    # `cf-cache-status: DYNAMIC`) ⇒ mỗi lượt mở app đều phải đi hết đường tới
    # origin, trong khi đây là trang TĨNH đã dựng sẵn. Nay:
    #   · max-age=0, must-revalidate → trình duyệt luôn hỏi lại (không bao giờ
    #     phục vụ HTML cũ sau khi deploy), nhưng hỏi bằng ETag nên phần lớn là
    #     304 rỗng thay vì tải lại cả trang.
    #   · s-maxage=300 → CDN/Cloudflare được phép giữ 5 phút. Deploy xong bản
    #     mới tới chậm nhất 5 phút, đổi lại lượt vào đầu của học sinh không phải
    #     chờ round-trip tới VPS.
    #   · stale-while-revalidate=86400 → hết 5 phút vẫn trả bản cũ tức thì rồi
    #     làm mới ngầm, nên không có "lượt xui" nào phải chờ.
    # LƯU Ý VẬN HÀNH: Cloudflare MẶC ĐỊNH KHÔNG cache text/html dù có header này.
    # Muốn ăn phần s-maxage phải tạo Cache Rule "Cache eligible for cache" cho
    # tutor.vietanh.org trong dashboard — xem docs/BAN-GIAO-TrangThai-DuAn.md.
    add_header Cache-Control "public, max-age=0, must-revalidate, s-maxage=300, stale-while-revalidate=86400";
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  # woff2/webp/png đã nén sẵn — nén lại chỉ tốn CPU, không nhỏ thêm byte nào.
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_vary on;

  # Ẩn phiên bản nginx.
  server_tokens off;
}
