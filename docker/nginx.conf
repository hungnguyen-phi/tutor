# Phục vụ Next static export (trailingSlash:true → mỗi trang là thư mục/index.html).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tài nguyên có hash (bất biến) → cache dài.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Trang: thử file, thư mục/index.html, rồi .html. Không có → trang 404 của Next.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Ẩn phiên bản nginx.
  server_tokens off;
}
