<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thẻ ghi nhớ · Hàm số bậc hai</title>
<style>
  :root {
    --navy: #26275d; --gold: #f9dd0e; --ink: #26332b; --muted: #6b7a8e;
    --line: #e4ebf4; --sky: #2e6db4; --surface: #fff; --bg: #eef3fb;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 18px; min-height: 100vh;
  }
  .top { width: 100%; max-width: 460px; display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .top b { color: var(--navy); font-size: 15px; }
  .top span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .card {
    width: 100%; max-width: 460px; height: 260px; perspective: 1400px; cursor: pointer;
  }
  .inner {
    position: relative; width: 100%; height: 100%; text-align: center;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.1, 1); transform-style: preserve-3d;
  }
  .card.flip .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 26px; border-radius: 20px; background: var(--surface);
    box-shadow: 0 8px 26px rgb(38 39 93 / 12%);
  }
  .face .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .front .tag { color: var(--sky); }
  .back { transform: rotateY(180deg); background: var(--navy); }
  .back .tag { color: var(--gold); }
  .front .q { font-size: 25px; font-weight: 700; line-height: 1.35; color: var(--ink); letter-spacing: -0.01em; }
  .back .a { font-size: 18px; line-height: 1.55; color: #fff; }
  .hint { font-size: 12px; color: var(--muted); }
  .back .hint { color: #aeb8d8; }
  .controls { width: 100%; max-width: 460px; display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  button {
    flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--navy);
    border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { border-color: var(--sky); }
  button.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  button:disabled { opacity: 0.4; cursor: default; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--gold); }
  .done { text-align: center; margin-top: 18px; color: var(--navy); font-weight: 600; font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
</style>
</head>
<body>
  <div class="top"><b>Thẻ ghi nhớ · Hàm số bậc hai</b><span id="count">1 / 6</span></div>
  <div class="card" id="card" role="button" tabindex="0" aria-label="Thẻ ghi nhớ, chạm để lật">
    <div class="inner">
      <div class="face front">
        <span class="tag">Câu hỏi</span>
        <div class="q" id="q"></div>
        <span class="hint">Chạm để xem đáp án</span>
      </div>
      <div class="face back">
        <span class="tag">Ghi nhớ</span>
        <div class="a" id="a"></div>
        <span class="hint">Chạm để quay lại</span>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="prev">‹ Trước</button>
    <button id="next" class="primary">Thẻ tiếp ›</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="done" id="done" hidden>✓ Bạn đã xem hết bộ thẻ — ôn lại lần nữa để nhớ lâu nhé!</div>

<script>
  var CARDS = [
    { q: "Dạng tổng quát của hàm số bậc hai?", a: "y = ax² + bx + c  (với a ≠ 0)" },
    { q: "Đồ thị của hàm số bậc hai là hình gì?", a: "Một đường parabol." },
    { q: "Hoành độ đỉnh parabol tính bằng công thức nào?", a: "x = −b / (2a)" },
    { q: "Khi a > 0, parabol quay bề lõm về phía nào?", a: "Lên trên — hàm có giá trị nhỏ nhất tại đỉnh." },
    { q: "Trục đối xứng của parabol là đường nào?", a: "Đường thẳng x = −b/(2a), đi qua đỉnh." },
    { q: "Đỉnh của y = x² − 4x + 3 nằm ở đâu?", a: "x = 4/2 = 2, y = 2²−4·2+3 = −1 → đỉnh (2; −1)." }
  ];
  var i = 0, card = document.getElementById("card");
  var qEl = document.getElementById("q"), aEl = document.getElementById("a");
  var countEl = document.getElementById("count"), dotsEl = document.getElementById("dots");
  var prev = document.getElementById("prev"), next = document.getElementById("next"), done = document.getElementById("done");
  var seen = {};
  for (var k = 0; k < CARDS.length; k++) { var d = document.createElement("i"); dotsEl.appendChild(d); }
  function render() {
    card.classList.remove("flip");
    qEl.textContent = CARDS[i].q; aEl.textContent = CARDS[i].a;
    countEl.textContent = (i + 1) + " / " + CARDS.length;
    seen[i] = true;
    var ds = dotsEl.children;
    for (var k = 0; k < ds.length; k++) ds[k].className = seen[k] ? "on" : "";
    prev.disabled = i === 0;
    next.textContent = i === CARDS.length - 1 ? "Xong" : "Thẻ tiếp ›";
    done.hidden = Object.keys(seen).length < CARDS.length;
  }
  card.onclick = function () { card.classList.toggle("flip"); };
  card.onkeydown = function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); card.classList.toggle("flip"); } };
  prev.onclick = function () { if (i > 0) { i--; render(); } };
  next.onclick = function () { if (i < CARDS.length - 1) { i++; render(); } };
  render();
</script>
</body>
</html>
