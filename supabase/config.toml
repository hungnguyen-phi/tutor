#   2. CAPTCHA / Turnstile (hCaptcha) (Auth → Attack Protection): chặn bot đăng ký/đăng nhập.
#   3. Leaked-password protection — HaveIBeenPwned (Auth → Passwords): chặn mật khẩu đã lộ.
#   4. MFA bắt buộc cho tài khoản STAFF (giáo viên/admin/leadership) (Auth → MFA):
#      thêm lớp bảo vệ cho tài khoản có quyền đọc dữ liệu học sinh.
#   5. Google provider (Auth → Providers → Google) + OAuth consent screen = Internal
#      (khoá server-side đúng Workspace trường) — xem docs/PRODUCTION-BOOTSTRAP.md §7.
#   6. Email provider bật cho magic-link phụ huynh (Auth → Providers → Email).
